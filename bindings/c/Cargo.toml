[package]
name = "ferrodoc-c"
description = "C ABI for ferrodoc, so Go, Java, C#, Ruby and Julia can link it"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexgaoth/ferrodoc"
# Distributed as a built library and a header, not through crates.io.
publish = false

[lib]
name = "ferrodoc"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ferrodoc = { path = "../../crates/ferrodoc" }

[profile.release]
opt-level = 3
lto = true
strip = true

[lints.rust]
# A C ABI cannot be written without `unsafe`: the pointers come from
# another language and only the caller knows they are valid. The rule here
# is that every `unsafe` block is one dereference wide and documented with
# what the caller must have guaranteed — never a block that spans logic.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
