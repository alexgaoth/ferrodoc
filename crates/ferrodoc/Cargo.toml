[package]
name = "ferrodoc"
description = "Universal document converter: markdown, HTML, DOCX and the pandoc AST"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

readme = "../../README.md"

[lib]
name = "ferrodoc"
path = "src/lib.rs"

[[bin]]
name = "ferrodoc"
path = "src/main.rs"

[dependencies]
ferrodoc-ast = { workspace = true }
ferrodoc-markdown = { workspace = true }
ferrodoc-html = { workspace = true }
ferrodoc-text = { workspace = true }
ferrodoc-docx = { workspace = true }
ferrodoc-odt = { workspace = true }
ferrodoc-epub = { workspace = true }
ferrodoc-latex = { workspace = true }
ferrodoc-rst = { workspace = true }
ferrodoc-asciidoc = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
