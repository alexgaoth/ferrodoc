[package]
name = "ferrodoc-harness"
description = "Differential test harness: ferrodoc vs pandoc, plus CommonMark spec runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Never goes to crates.io: it shells out to pandoc and reads the corpus, so
# it is only meaningful inside this repository. Without this, `cargo publish
# --workspace` tries to publish it and fails on the whole workspace.
publish = false

[dependencies]
comrak = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }
ferrodoc-ast = { workspace = true }
ferrodoc-markdown = { workspace = true }
# **With `highlight`.** The workspace dependency is
# `default-features = false`, so the harness was linking a
# ferrodoc-html with the highlighter compiled out — and
# `diff-epub-write` was therefore comparing our *unhighlighted* book
# against pandoc's highlighted one. A trimmed build is a different
# program, and this gate was measuring one.
ferrodoc-html = { workspace = true, features = ["highlight"] }
ferrodoc-text = { workspace = true }
ferrodoc-docx = { workspace = true }
ferrodoc-odt = { workspace = true }
ferrodoc-epub = { workspace = true }
ferrodoc-latex = { workspace = true }
ferrodoc-rst = { workspace = true }
ferrodoc-ipynb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
