[package]
name = "ferrodoc-markdown"
description = "Markdown reader producing the ferrodoc (pandoc-compatible) AST"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

readme = "../../README.md"

[dependencies]
ferrodoc-ast = { workspace = true }
# A table has no CommonMark spelling, so the writer falls back to the raw
# HTML pandoc falls back to — which is this crate's own writer, byte for
# byte. No cycle: `ferrodoc-html` does not depend on this.
ferrodoc-html = { workspace = true, default-features = false }
comrak = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
