[package]
name = "ferrodoc-html"
description = "HTML reader and writer for the ferrodoc (pandoc-compatible) AST"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

readme = "../../README.md"

[features]
# Syntax highlighting is a **size** decision as much as a fidelity one —
# see ROADMAP 0.7 — so it is a feature, and the trimmed build measures
# what it costs.
default = ["highlight"]
highlight = []

[dependencies]
ferrodoc-ast = { workspace = true }
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"

[dev-dependencies]
ferrodoc-markdown = { workspace = true }

[lints]
workspace = true
