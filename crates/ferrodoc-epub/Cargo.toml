[package]
name = "ferrodoc-epub"
description = "EPUB reader and writer producing the ferrodoc (pandoc-compatible) AST"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

readme = "../../README.md"

[dependencies]
ferrodoc-ast = { workspace = true }
# An EPUB's content documents are XHTML, so the reader that does the work
# already exists; this crate is the packaging around it.
ferrodoc-html = { workspace = true }
# For `xml`: an EPUB is a zip of XML parts like the office formats.
ferrodoc-docx = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
