name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags` builds the binaries and
# attaches them to a GitHub release. Publishing to crates.io stays manual —
# it is irreversible, and a yanked version is still a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the Linux binary runs on any distribution rather than
          # only ones with a new enough glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p ferrodoc --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="ferrodoc-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md COMPATIBILITY.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ -f "target/${{ matrix.target }}/release/ferrodoc.exe" ]; then
            cp "target/${{ matrix.target }}/release/ferrodoc.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/ferrodoc" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          fail_on_unmatched_files: false

  # The browser story shipped as something installable, not just a claim
  # that it compiles.
  wasm:
    name: wasm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release -p ferrodoc --target wasm32-unknown-unknown
      - name: Package
        run: |
          mkdir -p wasm
          cp target/wasm32-unknown-unknown/release/*.wasm wasm/ 2>/dev/null || true
          tar czf "ferrodoc-${GITHUB_REF_NAME}-wasm32.tar.gz" wasm
      - uses: softprops/action-gh-release@v2
        with:
          files: ferrodoc-*-wasm32.tar.gz
          fail_on_unmatched_files: false
