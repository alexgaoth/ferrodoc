name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Conformance is pinned: a different pandoc produces spurious diffs, so a
  # green run here means "identical to this version", not "identical to
  # whatever pandoc the runner happened to have".
  PANDOC_VERSION: 3.8.2.1

jobs:
  # Everything that does not need pandoc, on every platform we claim.
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
        # `verify.sh --quick` is the same three on Linux; the matrix runs
        # them directly so a Windows failure names the step that broke.
      # One trimmed build, because per-format features are what make the
      # size claim payable down and a missing `#[cfg]` only shows up here:
      # the default build compiles whatever the features forgot.
      - run: cargo test -p ferrodoc --no-default-features --features markdown,html
      - run: cargo clippy -p ferrodoc --all-targets --no-default-features --features markdown,html -- -D warnings

  # The browser and edge-worker story is a claim in the README; check it.
  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target wasm32-unknown-unknown --exclude ferrodoc-harness

  # The differential gates, which need the pinned pandoc binary. These are
  # the numbers the README quotes; if one drops, the README is wrong.
  conformance:
    name: conformance vs pinned pandoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pandoc ${{ env.PANDOC_VERSION }}
        run: |
          .github/fetch.sh \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" \
            pandoc.deb
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1
      - name: every gate, at the thresholds scripts/verify.sh holds
        run: ./scripts/verify.sh --gates
      # The gates cannot see a table's column alignment or an inline
      # CommonMark has no spelling for; `samples/` can, and did — three
      # silent data losses shipped past every gate above. This fails when
      # the committed artefacts stop being what this tree produces.
      - name: samples/ is still what this tree produces
        run: ./scripts/verify.sh --samples
      # `--gates` above already checks every figure it derived. These two
      # are the ones it cannot: both office writers are published against
      # the spec and gated against `corpus/`, 44 s a run.
      - name: the published figures no gate produces
        run: ./scripts/claims.sh --slow
      # An EPUB has a second judge that knows nothing of our intentions.
      - name: epubcheck accepts the hand-authored corpus
        run: |
          .github/fetch.sh \
            https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip \
            epubcheck.zip
          unzip -q epubcheck.zip
          for book in corpus/epub-handmade/*.epub; do
            java -jar epubcheck-5.1.0/epubcheck.jar "$book" 2>&1 | tee /tmp/check
            grep -q "0 fatals / 0 errors" /tmp/check || exit 1
          done
      # And the books this writes. This is the bar that matters for the
      # writer, and it is one **pandoc's own EPUB output does not clear**
      # on this corpus: it omits the required `dc:title`, and it emits
      # references to files that are not in the book. `diff-epub-write`
      # is scored below 100 because of exactly those disagreements, so
      # this step is what says which side of them is right.
      - name: epubcheck accepts every book this writes
        run: |
          cargo build --release -p ferrodoc
          for doc in corpus/*.md; do
            name=$(basename "$doc" .md)
            ./target/release/ferrodoc "$doc" -o "$RUNNER_TEMP/$name.epub"
            java -jar epubcheck-5.1.0/epubcheck.jar "$RUNNER_TEMP/$name.epub" 2>&1 | tee /tmp/check
            grep -q "0 fatals / 0 errors" /tmp/check || { echo "epubcheck rejected $name"; exit 1; }
          done

      # The notebook writer's judge, and it is Jupyter's own: the gate
      # above only says our notebook agrees with pandoc's, which two
      # writers could be wrong about together. `nbformat.validate` is
      # what refuses a notebook the Jupyter server would not open.
      - name: nbformat accepts every notebook this writes
        run: |
          python3 -m pip install --quiet nbformat
          cargo build --release -p ferrodoc
          python3 scripts/nbformat-check.py corpus/ipynb-handmade/*.ipynb

  # Memory is a product feature here, not hygiene: the browser and edge
  # targets have hard limits, and nothing else in CI would notice a path
  # getting hungrier.
  limits:
    name: resource limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: peak RSS per conversion path
        run: ./scripts/verify.sh --limits

  # Every size README publishes, re-derived. The bundle sizes and the
  # trimmed ratios had drifted 1.4% before this existed, because nothing
  # re-measured them after the code that made them true changed — and the
  # headline row said 4.6 MB against a 6.9 MB binary until it was gated
  # too, which is the same failure one level up.
  sizes:
    name: the published sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The headline table compares this binary with pandoc's, so both
      # sides have to be on the machine that checks the claim.
      - name: Install pandoc ${{ env.PANDOC_VERSION }}
        run: |
          .github/fetch.sh \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" \
            pandoc.deb
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1
      - name: byte counts and trimmed ratios
        run: ./scripts/claims.sh --sizes

  # The npm package. It lives outside the workspace, so nothing above
  # reaches it — and its whole claim (a document that never leaves the
  # client) can only be judged by a browser.
  wasm-package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 22, not 20: the browser driver speaks to Chrome over a WebSocket,
      # and Node only exposes one globally from 22. That is the driver's
      # requirement, not the package's — the tarball step below runs on 18,
      # which is the floor `package.json` claims.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install typescript for the declaration check
        run: cd bindings/wasm && npm install --no-save typescript
      - name: build, test, type-check, and drive a browser
        run: ./scripts/verify.sh --wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      # A package that builds and cannot be installed is the failure this
      # step exists for; the Python job caught exactly that once. Run on
      # the oldest Node `engines` admits, so the claim is tested and not
      # merely written down.
      - name: install the tarball into an empty project and run it
        run: |
          cd bindings/wasm && npm pack
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/bindings/wasm/ferrodoc-*.tgz
          cat > run.mjs <<'JS'
          import { convert } from "ferrodoc";
          const html = await convert("# Hi\n", "markdown", "html");
          if (html !== "<h1>Hi</h1>\n") { console.error("got", html); process.exit(1); }
          const docx = await convert("# Hi\n", "markdown", "docx");
          if (!(docx instanceof Uint8Array) || docx[0] !== 0x50) { process.exit(1); }
          console.log("installed package converts");
          JS
          node run.mjs

  # A LaTeX writer whose output pandoc reads back but TeX refuses has
  # missed the entire point: this writer exists so that
  # `ferrodoc x.docx -t latex | pdflatex` produces a PDF.
  latex:
    name: the LaTeX output compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: a minimal TeX, which is the point
        run: |
          .github/apt-install.sh \
            texlive-latex-base texlive-latex-recommended texlive-luatex
      - name: every corpus document compiles
        run: |
          cargo build --release -p ferrodoc
          mkdir -p "$RUNNER_TEMP/tex" && cd "$RUNNER_TEMP/tex"
          # A real 1x1 PNG for every picture the *corpus* names: TeX reads
          # the file to size the box, so a stub header will not do. Named
          # from the source and not from the output, so a URL the writer
          # mangled has no file and the step fails — the same rule the
          # sphinx job uses, and there it caught a real bug.
          png=iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          grep -ho '](\([^)]*\.\(png\|jpg\|gif\|svg\)\)' "$GITHUB_WORKSPACE"/corpus/*.md |
            sed 's/](//' | sort -u | while read -r image; do
              printf '%s' "$png" | base64 -d > "$image"
            done
          for doc in "$GITHUB_WORKSPACE"/corpus/*.md; do
            name=$(basename "$doc" .md)
            "$GITHUB_WORKSPACE/target/release/ferrodoc" "$doc" -t latex -s -o "$name.tex"
            if pdflatex -halt-on-error -interaction=nonstopmode "$name.tex" >/dev/null; then
              echo "compiled $name.pdf with pdflatex"
              continue
            fi
            # `pdflatex` reads UTF-8 through `inputenc`, which only knows
            # the characters it has declarations for: `edge-cases.md` has a
            # ☕ in it and no 8-bit engine can set it. That is a fact about
            # the engine, not about the output — pandoc emits the character
            # raw here too, and `diff-latex` requires that it does — so the
            # document is retried on a Unicode engine rather than skipped.
            # Which documents need one is printed, because a corpus quietly
            # narrowed is a gate that has stopped gating.
            echo "pdflatex refused $name; retrying on a Unicode engine"
            lualatex -halt-on-error -interaction=nonstopmode "$name.tex" >/dev/null \
              || { echo "FAILED to compile $name on either engine"; tail -40 "$name.log"; exit 1; }
            echo "compiled $name.pdf with lualatex"
          done

  # RST and AsciiDoc exist here to feed a documentation toolchain, so the
  # toolchain is the judge — and for AsciiDoc it is the *only* judge, since
  # pandoc writes AsciiDoc and cannot read it back.
  toolchains:
    name: sphinx and asciidoctor accept the output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          python3 -m pip install --quiet sphinx
          .github/apt-install.sh asciidoctor
      # For the one case sphinx refuses: the question is then whether this
      # writer produced it or the format cannot express the document, and
      # only pandoc's answer settles that.
      - name: Install pandoc ${{ env.PANDOC_VERSION }}
        run: |
          .github/fetch.sh \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" \
            pandoc.deb
          sudo dpkg -i pandoc.deb
      - name: build the writers
        run: cargo build --release -p ferrodoc
      - name: sphinx-build reads every corpus document
        run: |
          # Each document is its own project root. A `toctree` linking them
          # warns about every document whose markdown has no top-level
          # heading — a fact about the corpus, not about the writer, and
          # the kind of noise that gets a real warning suppressed later.
          fail=0
          for doc in "$GITHUB_WORKSPACE"/corpus/*.md; do
            name=$(basename "$doc" .md)
            mkdir -p "$RUNNER_TEMP/rst/$name" && cd "$RUNNER_TEMP/rst/$name"
            printf 'project = "gate"\nmaster_doc = "%s"\nexclude_patterns = ["out"]\n' "$name" > conf.py
            "$GITHUB_WORKSPACE/target/release/ferrodoc" "$doc" -t rst -o "$name.rst"
            # Every picture the *source* names, so that `image.not_readable`
            # stays a check on the URL the writer emitted. Creating the
            # files sphinx asks for instead would make it vacuous — and it
            # is the warning that caught a substitution definition written
            # inside its own paragraph, which swallowed the next sentence
            # into the file name.
            grep -ho '](\([^)]*\.\(png\|jpg\|gif\|svg\)\)' "$doc" | sed 's/](//' | sort -u |
              while read -r image; do
                printf '%s' iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg== |
                  base64 -d > "$image"
              done
            # -W turns every warning into an error: a malformed table or a
            # short title underline is a warning, and both mean the document
            # is wrong rather than merely untidy.
            if sphinx-build -q -W -b html . out; then
              echo "sphinx accepted $name"
              continue
            fi
            # Two documents reach a limit of the format rather than of
            # the writer, and in both pandoc's output is **byte-identical**
            # to this one — which is what proves it:
            #   `headings-deep.md` goes from a second-level heading
            #   straight to a fourth, and RST has no heading levels (the
            #   underline character defines one by where it first appears),
            #   so a skip is "Inconsistent title style";
            #   `nested-structures.md` has a thematic break inside a block
            #   quote, and docutils allows a transition nowhere but at the
            #   top level.
            # Anything else is a failure.
            # Both at their defaults: `--wrap=auto` at 72 on either side
            # since 2026-08-24, so naming a mode here would compare
            # ferrodoc's default with something nobody asks for.
            pandoc "$doc" -f commonmark -t rst > pandoc.rst
            if diff -q "$name.rst" pandoc.rst >/dev/null; then
              echo "sphinx refused $name; pandoc writes the same bytes, so this is the format"
            else
              echo "sphinx REJECTED $name, and pandoc's output differs"
              diff pandoc.rst "$name.rst" | head -20
              fail=1
            fi
          done
          exit $fail
      - name: asciidoctor reads every corpus document
        run: |
          mkdir -p "$RUNNER_TEMP/adoc" && cd "$RUNNER_TEMP/adoc"
          fail=0
          for doc in "$GITHUB_WORKSPACE"/corpus/*.md; do
            name=$(basename "$doc" .md)
            "$GITHUB_WORKSPACE/target/release/ferrodoc" "$doc" -t asciidoc -o "$name.adoc"
            if asciidoctor --failure-level=WARN -o "$name.html" "$name.adoc"; then
              echo "asciidoctor accepted $name"
              continue
            fi
            # The same document and the same cause as the sphinx step
            # above: `headings-deep.md` skips from a second-level heading
            # to a fourth, and AsciiDoc's `=` count is a level, so
            # asciidoctor says "section title out of sequence". Pandoc's
            # AsciiDoc for it is byte-identical to this writer's, which
            # is what makes it the document's limit rather than ours.
            pandoc "$doc" -f commonmark -t asciidoc > pandoc.adoc
            if diff -q "$name.adoc" pandoc.adoc >/dev/null; then
              echo "asciidoctor refused $name; pandoc writes the same bytes, so this is the format"
            else
              echo "asciidoctor REJECTED $name, and pandoc's output differs"
              diff pandoc.adoc "$name.adoc" | head -20
              fail=1
            fi
          done
          exit $fail

  # **Can this workspace still be published at all?**
  #
  # 0.7.0 could not. `ferrodoc-html` dev-depends on `ferrodoc-markdown`;
  # a commit five days earlier gave `ferrodoc-markdown` a dependency on
  # `ferrodoc-html`, closing a cycle cargo cannot order — and the error it
  # raises names the *index*, not the cycle:
  #
  #   failed to select a version for `ferrodoc-html = "^0.7.0"`
  #   candidate versions found which didn't match: 0.2.0, 0.1.0
  #
  # Nothing here could have caught it. `verify.sh` builds and tests from
  # the working tree; it never packages, so it never reads a manifest the
  # way crates.io will. This does, on every push, so the answer arrives on
  # the commit that breaks it rather than on release day.
  #
  # It does not need the version to be on crates.io: cargo packages the
  # members in dependency order and resolves each against the ones it has
  # just packaged. That is precisely what a cycle takes away.
  publishable:
    name: the workspace can still be packaged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --workspace

  # The C ABI, which is how Go, Java, C#, Ruby and Julia would link this.
  # Memory is the whole risk of the item: a leak of one result per
  # document is invisible in one conversion and fatal in a batch, and it
  # would be a leak in every language binding through this ABI.
  c-abi:
    name: C ABI, under valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: .github/apt-install.sh valgrind
      - name: build, test, and run the C example under valgrind
        run: ./scripts/verify.sh --c

  # Readers promise to refuse hostile input rather than panic. `cargo test`
  # runs a short fixed-seed loop; this runs a long one with a fresh seed, so
  # the search keeps moving instead of re-checking the same inputs forever.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ferrodoc-harness
      - name: mutate the corpus
        env:
          FERRODOC_FUZZ_SEED: ${{ github.run_id }}
        run: ./scripts/verify.sh --fuzz-only
