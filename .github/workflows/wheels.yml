name: Wheels

# The binding is a product commitment, so the wheels are built and
# *installed and tested* on every platform claimed, on every push that
# touches them — not only at release. A wheel that builds but does not
# import is the failure mode this exists to catch.
on:
  push:
    branches: [main]
    paths: ["bindings/python/**", ".github/workflows/wheels.yml"]
  pull_request:
    paths: ["bindings/python/**", ".github/workflows/wheels.yml"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # This crate depends on `ferrodoc` from crates.io rather than by path,
  # which is what makes maturin's sdist — only this directory — build for
  # anyone. The cost is an ordering: between the version bump and the
  # crates.io publish, **nothing below can be built by anyone**, and it is
  # not a fault in the code.
  #
  # It used to be a failing step inside every wheel job, so the workflow
  # went red for that window. A red that is expected is a red nobody
  # reads: a genuine failure — the binding's table test — sat behind one
  # of these for four days and was taken for the same thing. So the
  # question is asked once, here, and the answer *skips* the build on a
  # push and *fails* it on a release, where the ordering must already
  # hold. See docs/releasing.md.
  publishable:
    name: is the version this asks for on crates.io yet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.ask.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: ask
        shell: bash
        run: |
          want=$(sed -n 's/^ferrodoc = "\(.*\)"$/\1/p' bindings/python/Cargo.toml)
          have=$(cargo search ferrodoc --limit 1 | sed -n 's/^ferrodoc = "\(.*\)".*/\1/p')
          echo "Cargo.toml asks for ferrodoc $want; crates.io has $have"
          case "$have" in
            "$want"|"$want".*)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              if [ "${{ github.event_name }}" = "release" ]; then
                echo "::error::publish ferrodoc $want to crates.io first — the" \
                     "wheel cannot resolve until then, see docs/releasing.md"
                exit 1
              fi
              echo "::notice::ferrodoc $want is not on crates.io yet, so no wheel" \
                   "can be built from this commit. Skipping. This is the release" \
                   "ordering in docs/releasing.md, not a failure."
              ;;
          esac

  wheels:
    name: ${{ matrix.platform.name }}
    needs: publishable
    if: needs.publishable.outputs.ready == 'true'
    runs-on: ${{ matrix.platform.runner }}
    # Bounds how long a job may *run*, not how long it may wait for a
    # runner — the 24-hour wait that prompted this was queue time, which
    # only removing the unavailable runner label fixed. Kept anyway: a
    # wheel build that hangs is worth stopping too.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
          # Cross-compiled from the arm64 runner, because **there is no
          # Intel macOS runner left to schedule it on**: this leg sat
          # queued for 24 hours once and for 27 minutes again while every
          # other leg finished inside three. `timeout-minutes` does not
          # help — it bounds a job's *execution*, and a job that is never
          # scheduled never starts executing.
          #
          # The cost is stated rather than hidden: this is the one wheel
          # that is built and **not** installed and tested, because the
          # runner that could run it is what is missing. Every other
          # platform this ships to is exercised on itself below.
          - { name: macos-x86_64, runner: macos-latest, target: x86_64, cross: true }
          - { name: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          # manylinux so the wheel installs on distributions older than
          # the runner, which is most of them.
          manylinux: auto

      - name: Install it and run the tests against the installed wheel
        if: '!matrix.platform.cross'
        working-directory: bindings/python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --find-links dist --force-reinstall ferrodoc
          # Run from a directory that is not the source, so the import
          # resolves to the installed wheel rather than to `python/`.
          cd "$(mktemp -d)"
          python -c "import ferrodoc; print(ferrodoc.__version__, ferrodoc.formats())"
          python -m pytest "$GITHUB_WORKSPACE/bindings/python/tests" -q

      # The one leg that cannot run its wheel still has to prove it built
      # the right *kind* of wheel: a cross-build that silently produced
      # another arm64 file would upload a package that installs nowhere.
      - name: at least check the wheel is tagged for the platform it claims
        if: matrix.platform.cross
        working-directory: bindings/python
        shell: bash
        run: |
          ls dist/
          ls dist/ | grep -q 'macosx.*x86_64' || {
            echo "::error::no x86_64 macOS wheel in dist/; the cross build produced something else"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: bindings/python/dist/*.whl

  sdist:
    needs: publishable
    if: needs.publishable.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      # The sdist contains only `bindings/python`, which is why the crate
      # depends on `ferrodoc` from crates.io rather than by path. Building
      # it here is what proves that.
      - name: Build from the source distribution alone
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          cd "$(mktemp -d)"
          python -m pip install "$GITHUB_WORKSPACE"/bindings/python/dist/*.tar.gz
          python -c "import ferrodoc; print('sdist builds:', ferrodoc.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  # Until this existed, every wheel above was built, installed and tested
  # on four platforms and then thrown away as a CI artifact — while
  # `README.md` opened with `pip install ferrodoc`, which 404'd.
  #
  # Runs only when a human publishes the release. Trusted publishing, so
  # there is no long-lived token in this repository; the one-time setup is
  # a pending publisher on PyPI naming this repo, this workflow file and
  # the `pypi` environment.
  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
