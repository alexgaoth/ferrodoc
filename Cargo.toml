[workspace]
resolver = "3"
members = [
    "crates/ferrodoc",
    "crates/ferrodoc-ast",
    "crates/ferrodoc-markdown",
    "crates/ferrodoc-html",
    "crates/ferrodoc-text",
    "crates/ferrodoc-harness",
    "crates/ferrodoc-docx",
]
# The Python binding is built by maturin, not by cargo, and it depends on
# `ferrodoc` from crates.io so that maturin's source distribution — which
# contains only that directory — resolves for anyone building it. Keeping
# it out of the workspace also keeps `cargo test --workspace` from needing
# Python development headers.
exclude = ["bindings/python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The edition needs a recent compiler; state it so `cargo add` can refuse
# rather than fail to build on someone's machine.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexgaoth/ferrodoc"
homepage = "https://github.com/alexgaoth/ferrodoc"
keywords = ["pandoc", "markdown", "docx", "html", "converter"]
categories = ["text-processing", "parser-implementations", "command-line-utilities"]

[workspace.dependencies]
# The version is what a published crate depends on; the path is what this
# workspace builds against. `cargo publish` refuses a path-only dependency,
# so without both, every crate above ferrodoc-ast is unpublishable.
ferrodoc-ast = { path = "crates/ferrodoc-ast", version = "0.1.0" }
ferrodoc-markdown = { path = "crates/ferrodoc-markdown", version = "0.1.0" }
ferrodoc-html = { path = "crates/ferrodoc-html", version = "0.1.0" }
ferrodoc-text = { path = "crates/ferrodoc-text", version = "0.1.0" }
ferrodoc-docx = { path = "crates/ferrodoc-docx", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip makes parsed doubles bit-identical to their source text,
# so comparing our AST against pandoc's JSON never reports a phantom
# 1-ULP difference in table column widths.
serde_json = { version = "1", features = ["float_roundtrip"] }
comrak = { version = "0.54", default-features = false }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
