[workspace]
resolver = "3"
members = [
    "crates/ferrodoc",
    "crates/ferrodoc-ast",
    "crates/ferrodoc-markdown",
    "crates/ferrodoc-html",
    "crates/ferrodoc-text",
    "crates/ferrodoc-harness",
    "crates/ferrodoc-docx",
    "crates/ferrodoc-odt",
    "crates/ferrodoc-epub",
    "crates/ferrodoc-latex",
    "crates/ferrodoc-rst",
    "crates/ferrodoc-asciidoc",
    "crates/ferrodoc-ipynb",
]
# Neither binding is a workspace member. The Python one is built by maturin
# and depends on `ferrodoc` from crates.io, so that maturin's source
# distribution — which contains only that directory — resolves for anyone
# building it; keeping it out also spares `cargo test --workspace` the need
# for Python development headers. The wasm one needs
# `unsafe_code = "allow"` for its `#[unsafe(no_mangle)]` exports, and the
# workspace forbids that — see `bindings/wasm/src/lib.rs` for why it still
# contains no `unsafe` block.
exclude = ["bindings/python", "bindings/wasm", "bindings/c"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# The edition needs a recent compiler; state it so `cargo add` can refuse
# rather than fail to build on someone's machine.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexgaoth/ferrodoc"
homepage = "https://github.com/alexgaoth/ferrodoc"
keywords = ["pandoc", "markdown", "docx", "html", "converter"]
categories = ["text-processing", "parser-implementations", "command-line-utilities"]

[workspace.dependencies]
# The version is what a published crate depends on; the path is what this
# workspace builds against. `cargo publish` refuses a path-only dependency,
# so without both, every crate above ferrodoc-ast is unpublishable.
ferrodoc-ast = { path = "crates/ferrodoc-ast", version = "0.7.0" }
ferrodoc-markdown = { path = "crates/ferrodoc-markdown", version = "0.7.0" }
# `default-features = false` here, so `highlight` is a choice each
# dependent makes: `ferrodoc` forwards its own feature, and the EPUB
# writer does not want it. See ROADMAP 0.7.
ferrodoc-html = { path = "crates/ferrodoc-html", version = "0.7.0", default-features = false }
ferrodoc-text = { path = "crates/ferrodoc-text", version = "0.7.0" }
ferrodoc-docx = { path = "crates/ferrodoc-docx", version = "0.7.0" }
ferrodoc-odt = { path = "crates/ferrodoc-odt", version = "0.7.0" }
ferrodoc-epub = { path = "crates/ferrodoc-epub", version = "0.7.0" }
ferrodoc-latex = { path = "crates/ferrodoc-latex", version = "0.7.0" }
ferrodoc-rst = { path = "crates/ferrodoc-rst", version = "0.7.0" }
ferrodoc-asciidoc = { path = "crates/ferrodoc-asciidoc", version = "0.7.0" }
ferrodoc-ipynb = { path = "crates/ferrodoc-ipynb", version = "0.7.0" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip makes parsed doubles bit-identical to their source text,
# so comparing our AST against pandoc's JSON never reports a phantom
# 1-ULP difference in table column widths.
serde_json = { version = "1", features = ["float_roundtrip"] }
# `attributes` is a code-only feature — its entry in comrak's manifest is
# `attributes = []`, no dependency behind it. It is what carries
# `# H {#id .cls key=val}` off the heading line for `pandoc_markdown`.
comrak = { version = "0.54", default-features = false, features = ["attributes"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
