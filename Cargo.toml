[workspace]
resolver = "3"
members = [
    "crates/ferrodoc",
    "crates/ferrodoc-ast",
    "crates/ferrodoc-markdown",
    "crates/ferrodoc-html",
    "crates/ferrodoc-text",
    "crates/ferrodoc-harness",
    "crates/ferrodoc-docx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexgaoth/ferrodoc"

[workspace.dependencies]
ferrodoc-ast = { path = "crates/ferrodoc-ast" }
ferrodoc-markdown = { path = "crates/ferrodoc-markdown" }
ferrodoc-html = { path = "crates/ferrodoc-html" }
ferrodoc-text = { path = "crates/ferrodoc-text" }
ferrodoc-docx = { path = "crates/ferrodoc-docx" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip makes parsed doubles bit-identical to their source text,
# so comparing our AST against pandoc's JSON never reports a phantom
# 1-ULP difference in table column widths.
serde_json = { version = "1", features = ["float_roundtrip"] }
comrak = { version = "0.54", default-features = false }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
